# Ansible inventory for ShopEasy on AWS EC2
# Default SSH user: ubuntu (Ubuntu AMI). The playbook uses apt, so use an Ubuntu AMI.

# ---------- OPTION A: single EC2 instance (simplest) ----------
# SSH into the instance, install Ansible there, and run:
#   ansible-playbook site.yml --limit local
[local]
localhost ansible_connection=local

# ---------- OPTION B: control node + separate EC2 targets ----------
# Run Ansible from one instance (or your laptop) against other instances.
# Use PRIVATE IPs if all instances are in the same VPC, otherwise PUBLIC IPs.
[web]
web1 ansible_host=<WEB_EC2_IP>

[db]
db1 ansible_host=<DB_EC2_IP>

[monitoring]
mon1 ansible_host=<MON_EC2_IP>

[staging:children]
web
db

[web:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/<your-key>.pem

[db:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/<your-key>.pem

[monitoring:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/<your-key>.pem

[all:vars]
ansible_python_interpreter=/usr/bin/python3
