---
# ShopEasy (E-commerce) - configuration management playbook
# Run:  ansible-playbook site.yml
# Dry run: ansible-playbook site.yml --check --diff

# ---------------------------------------------------------------
# Play 1: Web tier - install Nginx and deploy the storefront
# ---------------------------------------------------------------
- name: Configure web servers (Nginx + ShopEasy storefront)
  hosts: web:local
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install web packages
      ansible.builtin.apt:
        name: "{{ web_packages }}"
        state: present

    - name: Create web root directory
      ansible.builtin.file:
        path: "{{ web_root }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Deploy storefront landing page
      ansible.builtin.template:
        src: index.html.j2
        dest: "{{ web_root }}/index.html"
        owner: www-data
        group: www-data
        mode: "0644"

    - name: Deploy Nginx site configuration
      ansible.builtin.template:
        src: nginx-shopeasy.conf.j2
        dest: /etc/nginx/sites-available/shopeasy
        mode: "0644"
      notify: Reload nginx

    - name: Enable ShopEasy site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/shopeasy
        dest: /etc/nginx/sites-enabled/shopeasy
        state: link
      notify: Reload nginx

    - name: Disable default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Ensure Nginx is enabled and running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Verify the health endpoint responds
      ansible.builtin.uri:
        url: "http://localhost:{{ web_port }}/health"
        status_code: 200
      register: health_check
      retries: 5
      delay: 2
      until: health_check.status == 200

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

# ---------------------------------------------------------------
# Play 2: Database tier - install MySQL and create app database
# ---------------------------------------------------------------
- name: Configure database server (MySQL)
  hosts: db:local
  become: true
  tasks:
    - name: Install MySQL packages
      ansible.builtin.apt:
        name: "{{ db_packages }}"
        state: present
        update_cache: true

    - name: Ensure MySQL is enabled and running
      ansible.builtin.service:
        name: mysql
        state: started
        enabled: true

    - name: Create application database
      community.mysql.mysql_db:
        name: "{{ db_name }}"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Create application database user
      community.mysql.mysql_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        priv: "{{ db_name }}.*:ALL"
        host: "%"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
      no_log: true

# ---------------------------------------------------------------
# Play 3: Monitoring - Prometheus node_exporter on every server
# ---------------------------------------------------------------
- name: Install monitoring agent (node_exporter)
  hosts: web:db:monitoring:local
  become: true
  tasks:
    - name: Create node_exporter system user
      ansible.builtin.user:
        name: node_exporter
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Download and unpack node_exporter
      ansible.builtin.unarchive:
        src: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: /tmp
        remote_src: true
        creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"

    - name: Install node_exporter binary
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: /usr/local/bin/node_exporter
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart node_exporter

    - name: Install systemd unit for node_exporter
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network.target

          [Service]
          User=node_exporter
          ExecStart=/usr/local/bin/node_exporter --web.listen-address=:{{ node_exporter_port }}
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      notify: Restart node_exporter

    - name: Enable and start node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        daemon_reload: true
        enabled: true
        state: started

  handlers:
    - name: Restart node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        daemon_reload: true
        state: restarted
